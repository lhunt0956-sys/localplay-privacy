name: Daily News Push

on:
  schedule:
    # 每天北京时间 8:00（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - "news-bot/**"
      - ".github/workflows/news-push.yml"

permissions:
  contents: write

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: news-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r news-bot/requirements.txt

      - name: Fetch news & push
        id: digest
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TYPE: ${{ secrets.WEBHOOK_TYPE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          # 推送失败不阻断摘要落盘；真正阻断只看抓取是否写出文件
          set +e
          python news-bot/main.py --push
          code=$?
          set -e
          if [ ! -f news/latest.html ]; then
            echo "digest html missing"
            exit 1
          fi
          exit 0

      - name: Commit digest pages
        if: always() && hashFiles('news/latest.html') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/
          if git diff --staged --quiet; then
            echo "No digest changes"
          else
            git commit -m "chore(news): update daily digest"
            git push
          fi
