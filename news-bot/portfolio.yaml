# 关注行业（对齐持仓：煤电银半新能源 + 高股息防御）
watched_industries:
  - name: 煤炭
    match: ["煤炭"]
    why: 对应中国神华，关注煤价与高股息逻辑
  - name: 电力/公用
    match: ["电力", "公用事业", "供水供气"]
    why: 对应长江电力，关注来水与股息稳定性
  - name: 金融/银行
    match: ["金融", "银行"]
    why: 对应工商银行，关注净息差与分红
  - name: 半导体/电子
    match: ["电子器件", "电子信息", "半导体", "芯片"]
    why: 对应半导体ETF，关注景气与政策
  - name: 石油
    match: ["石油"]
    why: 能源价格联动，影响通胀与高股息板块风险偏好
  - name: 新能源/光伏
    match: ["光伏", "电池", "风电", "新能源", "电力设备"]
    why: 对应新能源ETF，波动大，只作卫星仓观察

